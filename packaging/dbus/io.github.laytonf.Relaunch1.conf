<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root owns the name; any user may call it. Authority is enforced by
       polkit on the authorize action, not by the bus policy. -->
  <policy user="root">
    <allow own="io.github.laytonf.Relaunch1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.laytonf.Relaunch1"/>
  </policy>
</busconfig>
