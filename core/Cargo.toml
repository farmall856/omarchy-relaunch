[workspace]
resolver = "2"
members = ["crates/relaunch-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

# Pinned, vendored for the package build (see core/README.md). Exact versions,
# not caret ranges, so a rebuild cannot silently pull a newer transitive tree
# into the security core.
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
