[package]
name = "relaunchd"
description = "Root D-Bus authority for Relaunch: per-uid keys, polkit-gated signing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "relaunchd"
path = "src/lib.rs"

[[bin]]
name = "relaunchd"
path = "src/main.rs"

[dependencies]
relaunch-core = { path = "../relaunch-core" }
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true
relaunch-sys = { path = "../relaunch-sys" }
# Transport (binary only). Caret + Cargo.lock pin; vendored for the package
# build. The security core (relaunch-core) stays free of this tree.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"

[dev-dependencies]
# Sets the umask in tests/store_umask.rs (its own process).
nix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
